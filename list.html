<dl style="color: blue;">
    <dt style="color: red;">WELCOME</dt>
    <dd>Sign in to access your account and continue exploring all features securely.</dd>
</dl>
<form style="color: blueviolet;">
    <label for="fname">First Name :</label>
    <input type="text" ; placeholder="Enter First Name" ; maxlength="12" ; min="3" ; id="fname" ; required>
    <label for="lname">Last Name :</label>
    <input type="text" ; placeholder="Enter last Name" ; maxlength="12" ; min="3" ; id="lname" ; required>
    <br>
    <br>
    <label for="tel">Phone Number :</label>
    <input type="tel" ; placeholder="Enter Phone Number" ; id="tel" , maxlength="10" , pattern="[0-9]{10}" ; required>
    <br>
    <br>
    <label for="password">Password :</label>
    <input type="password" ; placeholder="Enter Password" ; id="password" ; maxlength="13" ; min="2" ; required>
    <br>
    <br>
    <input type="submit">
    <input type="reset">
</form>
<button>Login</button>
