<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form>
    <label for="fname"> First Name : </label>
    <input type="text" ; maxlength="10" ; minlength="2" ; id="fname" ; required ; placeholder="Enter the fist name">
    <label for="lname"> Last Name :</label>
    <input type="text" ; maxlength="10 " ; minlength="3" ; id="lname" ; required ; placeholder="Enter the last name">
    <br><br>
    <label for="mobile">Number : </label>
    <input type="tel" ; placeholder="123-456-7890" ; pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" ; required ; id="mobile">
    <br><br>
    <label for="email">Email : </label>
    <input type="email" ; id="email" ; placeholder=" @gmail.com" ; required>
    <br><br>
    <label for="password"> Password : </label>
    <input type="password" ; id="password" ; maxlength="10" ; minlength="3" ; required ;
      placeholder="Enter the password"><br><br>
    <label for="count">Range : </label>
    <input type="range" ; maxlength="20" ; min="0" ; id="count" ; step="2" ; required ; value="10">
    <br><br>
    <label>SKILLS : </label>
    <input type="checkbox">HTML
    <input type="checkbox">CSS
    <input type="checkbox" ; required>JAVA SCRIPT
    <input type="checkbox">REACT
    <input type="checkbox">NODE
    <br><br>
    <label>Gender : </label>
    <input type="radio" ; name="gender">Male
    <input type="radio" ; name="gender">Girl
    <input type="radio" ; name="gender">other
    <br><br>
    <label>Country : </label>
    <select>
      <option value=""> Select</option>
      <option value="India">India</option>
      <option value="Russia">Russia</option>
      <option value="taly">Italy</option>
      <option value="Japan">Japan</option>
      <option value="Germany">Germany</option>
    </select>
    <br><br>
    <label>Date of Birth : </label>
    <input type="date" min="1990-01-01" ; max="2060-01-01" ; required>
    <br><br>
    <label>Time : </label>
    <input type="time" ; required>
    <br><br>
    <label>color : </label>
    <input type="color" ; required>
    <br><br>
    <label>File upload : </label>
    <input type="file" ; accept=".pdf .svs .png">
    <br><br>

    <br><br>
    <input type="submit">
    <input type="reset">
  </form>
  <button>Login</button>

</body>

</html>
